name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Synthetic database and stdio tests
        env:
          PW_RUN_PROTOCOL_TEST: '1'
          PYTHONIOENCODING: utf-8
        run: python -B -X utf8 -m unittest discover -s tests -v
